# Bounded container logs (SEC-013): json-file capped at 10 MB x 5 per service so a chatty
# process can never fill the 38 GB root disk. Applied on the next `docker compose up`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: racedz_postgres_prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-racedz}
      POSTGRES_USER: ${POSTGRES_USER:-racedz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - racedz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racedz} -d ${POSTGRES_DB:-racedz}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: racedz-app:latest
    container_name: racedz_app_prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${RACEDZ_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3003
      # SEC-008: the running app never holds superuser (`racedz`) — only a dedicated `racedz_app`
      # role with plain DML (SELECT/INSERT/UPDATE/DELETE) on the public schema, granted once via
      # the SQL in docs/OPERATIONS.md. An app-layer bug (SQLi, a bad raw query, an SSRF into the
      # DB) is now bounded by that grant instead of reaching CREATEDB/CREATEROLE/other databases.
      # `MIGRATE_DATABASE_URL` below carries the superuser connection, used ONLY for the deploy-time
      # migration step, which genuinely needs DDL.
      DATABASE_URL: postgresql://racedz_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required — see docs/OPERATIONS.md}@postgres:5432/${POSTGRES_DB:-racedz}
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:-racedz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-racedz}
    # Not published publicly — Caddy reverse-proxies to it over the internal
    # Docker network. Bound to loopback only so `curl localhost:3003` still
    # works for debugging on the host (Docker port-publishing bypasses ufw,
    # so do NOT bind this to 0.0.0.0).
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3003"
    volumes:
      - racedz_uploads:/app/public/uploads
    # tts:purge-legacy erases the pre-allowlist arbitrary-text audio cache from the persistent
    # uploads volume (DD6-R01/FD1-R03). It is idempotent and deliberately non-blocking — it reports
    # TTS_PURGE_OK / TTS_PURGE_FAILED and never prevents startup; see docs/OPERATIONS.md. It touches
    # only the filesystem, so it runs under the container's normal (restricted) DATABASE_URL.
    # `prisma:deploy` is the one step that needs DDL, so it alone runs with DATABASE_URL swapped to
    # MIGRATE_DATABASE_URL for its own invocation — everything else in this container, including the
    # long-running server started by start:docker, keeps the restricted connection.
    command: sh -c "DATABASE_URL=\"$$MIGRATE_DATABASE_URL\" npm run prisma:deploy && npm run tts:purge-legacy && npm run start:docker"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Scheduler for internal jobs: the daily coach inactivity nudge, a daily plan-rollover (regenerate
  # next week when a runner's plan has ended), the daily "don't forget your run today" reminder, and
  # a frequent broadcast-dispatch tick that drains any in-flight admin broadcast. All hit the app's
  # CRON_SECRET-guarded internal routes over the Docker network, so the requests never leave the
  # host. Schedules/targets are overridable via env; CRON_SECRET comes from the env file. Rollover
  # runs before the reminder so today's run exists when the reminder fires; the broadcast tick and
  # both coach jobs are cheap no-ops when there's nothing to do.
  cron:
    image: alpine:3.20
    container_name: racedz_cron_prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ${RACEDZ_ENV_FILE:-.env.production}
    environment:
      TZ: ${CRON_TZ:-UTC}
      NUDGE_SCHEDULE: ${COACH_NUDGE_CRON:-0 17 * * *}
      NUDGE_URL: ${COACH_NUDGE_URL:-http://app:3003/api/internal/cron/inactivity-nudge}
      BROADCAST_SCHEDULE: ${BROADCAST_DISPATCH_CRON:-*/2 * * * *}
      BROADCAST_URL: ${BROADCAST_DISPATCH_URL:-http://app:3003/api/internal/cron/broadcast-dispatch}
      # Default 10:00 in the container's TZ (UTC → 11:00 Africa/Algiers) — a late-morning reminder.
      REMINDER_SCHEDULE: ${TRAINING_REMINDER_CRON:-0 10 * * *}
      REMINDER_URL: ${TRAINING_REMINDER_URL:-http://app:3003/api/internal/cron/training-reminder}
      # Runs a few hours before the reminder so an ended plan is regenerated (today's run exists)
      # before the reminder fires. 05:00 UTC → 06:00 Africa/Algiers.
      ROLLOVER_SCHEDULE: ${TRAINING_ROLLOVER_CRON:-0 5 * * *}
      ROLLOVER_URL: ${TRAINING_ROLLOVER_URL:-http://app:3003/api/internal/cron/plan-rollover}
    # `$$` escapes Compose interpolation so the variable is resolved by the in-container shell.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache curl tzdata >/dev/null
        cat > /usr/local/bin/run-nudge <<EOF
        #!/bin/sh
        curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}" "$${NUDGE_URL}" || echo "coach nudge request failed"
        EOF
        cat > /usr/local/bin/run-broadcast <<EOF
        #!/bin/sh
        curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}" "$${BROADCAST_URL}" || echo "broadcast dispatch request failed"
        EOF
        cat > /usr/local/bin/run-reminder <<EOF
        #!/bin/sh
        curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}" "$${REMINDER_URL}" || echo "training reminder request failed"
        EOF
        cat > /usr/local/bin/run-rollover <<EOF
        #!/bin/sh
        curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}" "$${ROLLOVER_URL}" || echo "plan rollover request failed"
        EOF
        chmod +x /usr/local/bin/run-nudge /usr/local/bin/run-broadcast /usr/local/bin/run-reminder /usr/local/bin/run-rollover
        {
          echo "$${NUDGE_SCHEDULE} /usr/local/bin/run-nudge >/proc/1/fd/1 2>/proc/1/fd/2"
          echo "$${BROADCAST_SCHEDULE} /usr/local/bin/run-broadcast >/proc/1/fd/1 2>/proc/1/fd/2"
          echo "$${ROLLOVER_SCHEDULE} /usr/local/bin/run-rollover >/proc/1/fd/1 2>/proc/1/fd/2"
          echo "$${REMINDER_SCHEDULE} /usr/local/bin/run-reminder >/proc/1/fd/1 2>/proc/1/fd/2"
        } > /etc/crontabs/root
        echo "cron scheduled: nudge [$${NUDGE_SCHEDULE}] broadcast [$${BROADCAST_SCHEDULE}] rollover [$${ROLLOVER_SCHEDULE}] reminder [$${REMINDER_SCHEDULE}]"
        crond -f -l 8

  caddy:
    image: caddy:2-alpine
    container_name: racedz_caddy_prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - racedz_caddy_data:/data
      - racedz_caddy_config:/config
      # Same volume the app writes uploads to — Caddy serves /uploads/* directly
      # (read-only) because `next start` doesn't serve runtime-written public files.
      - racedz_uploads:/srv/uploads:ro
    # Caddy serves every vhost from one process, so a config it can't adapt (a bad `import`,
    # for instance — this is what actually happened, 2026-08-30 to 2026-09-03) leaves it
    # crash-looping with no visible signal: `restart: unless-stopped` keeps retrying forever
    # and `docker ps` just shows "Restarting", which nobody was watching. The admin API only
    # comes up once the config adapts and the server starts, so probing it is a direct
    # "is Caddy actually serving" check — 127.0.0.1, not localhost: this image's admin
    # listener is IPv4-only and localhost can resolve to ::1 first and get refused.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  racedz_postgres_data:
  racedz_uploads:
  racedz_caddy_data:
  racedz_caddy_config:
