name: Android Internal Testing Release

on:
  push:
    tags:
      # This repo tags combined releases as v0.8.1-rc1 etc. (see EXECUTION_PLAN.md) — there is no
      # separate android-v* scheme in use. The previous glob never matched any tag actually pushed,
      # so every release to date was published via workflow_dispatch instead of the tag trigger.
      - "v*"
  # Manual publishing must name its version: falling back to the in-file versionCode (13) would be
  # rejected by Play as soon as any tag-derived code (>= 80000) has been uploaded.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, X.Y.Z-rcN (N = 1..98) or X.Y.Z for a final; must exceed every code already on Play"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-internal
  cancel-in-progress: false

jobs:
  publish-internal:
    name: Build and publish Internal testing AAB
    runs-on: ubuntu-latest
    environment: play-internal

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test the version scheme
        run: bash scripts/test-android-version-from-tag.sh

      - name: Derive version
        # vX.Y.Z-rcN -> versionName X.Y.Z, versionCode X*1000000 + Y*10000 + Z*100 + N (N = 1..98);
        # a final vX.Y.Z uses N = 99 so it outranks its own candidates. Rules and tests live in
        # scripts/android-version-from-tag.sh / scripts/test-android-version-from-tag.sh.
        # Tag pushes use the tag; manual runs must supply the same form as the `version` input.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            label="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            label="$GITHUB_REF_NAME"
          else
            echo "Refusing to publish from a non-tag push ($GITHUB_REF)"; exit 1
          fi
          # Captured first: a failure inside `read < <(...)` would not stop the job under set -e.
          parsed=$(bash scripts/android-version-from-tag.sh "$label")
          read -r name code <<< "$parsed"
          date=$(git log -1 --format=%cs "$GITHUB_SHA")
          echo "$label -> versionName $name, versionCode $code, releaseDate $date"
          echo "ZIDRUN_VERSION_ARGS=-Pzidrun.versionCode=$code -Pzidrun.versionName=$name -Pzidrun.releaseDate=$date" >> "$GITHUB_ENV"
          echo "ZIDRUN_VERSION_LABEL=$label" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default is "tools platform-tools"; the legacy "tools" package no longer
          # exists in cmdline-tools 16+ (runner image 2026-11), so sdkmanager exits 1 on it.
          # Gradle fetches the platform/build-tools it needs itself.
          packages: platform-tools

      - name: Restore upload signing credentials
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZIDRUN_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ZIDRUN_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ZIDRUN_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ZIDRUN_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "Missing ZIDRUN_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$UPLOAD_STORE_PASSWORD" || { echo "Missing ZIDRUN_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$UPLOAD_KEY_ALIAS" || { echo "Missing ZIDRUN_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$UPLOAD_KEY_PASSWORD" || { echo "Missing ZIDRUN_UPLOAD_KEY_PASSWORD"; exit 1; }

          keystore_file="$RUNNER_TEMP/zidrun-upload.keystore"
          signing_file="$RUNNER_TEMP/zidrun-upload-signing.properties"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          {
            printf 'storeFile=%s\n' "$keystore_file"
            printf 'storePassword=%s\n' "$UPLOAD_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$UPLOAD_KEY_PASSWORD"
          } > "$signing_file"
          printf 'ZIDRUN_SIGNING_FILE=%s\n' "$signing_file" >> "$GITHUB_ENV"

      - name: Verify Play credentials are present
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_PUBLISHER_CREDENTIALS" || {
            echo "Missing ANDROID_PUBLISHER_CREDENTIALS"
            exit 1
          }

      - name: Run Android quality gates
        working-directory: native-android
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest

      - name: Build signed App Bundle
        working-directory: native-android
        run: ./gradlew --no-daemon bundleRelease -Pzidrun.signing="$ZIDRUN_SIGNING_FILE" $ZIDRUN_VERSION_ARGS

      - name: Record AAB checksum
        working-directory: native-android
        run: sha256sum app/build/outputs/bundle/release/app-release.aab | tee app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Keep signed AAB as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zidrun-aab-${{ env.ZIDRUN_VERSION_LABEL }}
          path: |
            native-android/app/build/outputs/bundle/release/app-release.aab
            native-android/app/build/outputs/bundle/release/app-release.aab.sha256
          retention-days: 90

      - name: Publish to Google Play Internal testing
        working-directory: native-android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: ./gradlew --no-daemon publishReleaseBundle --track internal -Pzidrun.signing="$ZIDRUN_SIGNING_FILE" $ZIDRUN_VERSION_ARGS
