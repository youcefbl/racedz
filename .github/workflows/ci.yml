name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # SEC-012: supply-chain surveillance. Separate job so a dependency advisory or a leaked secret
  # fails the build on its own evidence, instead of being lost inside the long verify job.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails on any advisory at high or above. The overrides in package.json are what keep this
      # green; a new advisory should stop a release rather than be discovered after it.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # Lockfile integrity: `npm ci` already refuses a lockfile that disagrees with package.json,
      # so a drifted lockfile fails above. This asserts the lockfile is actually committed.
      - name: Lockfile present and current
        run: |
          test -f package-lock.json || { echo "package-lock.json missing"; exit 1; }
          git diff --exit-code package-lock.json

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SBOM for the release record: what actually shipped, attached to the run that built it.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-format JSON --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: racedz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/racedz_ci
      # Non-secret placeholders so the app can boot in CI. Real values live in deploy env.
      AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3003
      NEXTAUTH_URL: http://127.0.0.1:3003
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3003
      RACEDZ_BASE_URL: http://127.0.0.1:3003
      RACEDZ_SEED_BULK: "0"

    steps:
      # SEC-012: pinned to a commit SHA, not a mutable tag — a repointed @v4 tag would be a
      # supply-chain compromise vector (semgrep: yaml.github-actions.security.github-actions-mutable-action-tag).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Commit-review coverage starts at a fixed historical commit and needs full ancestry.
          fetch-depth: 0

      - name: Check commit review coverage
        # pull_request checks run on a synthetic merge commit; audit the contributor's real head.
        run: node scripts/check-commit-review-coverage.mjs --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      # Quality gates.
      - run: npm run lint # eslint + i18n key-parity
      - run: npm run typecheck
      - run: npm run test:coach
      - run: npm run test:workout
      - run: npm run test:mfa

      # Apply migrations to the CI database, then build.
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run build

      # Browser journeys and visual/UI regression checks. Playwright starts the
      # canonical dev server itself through playwright.config.ts.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Boot the production server and run the smoke checks against it.
      - name: Start server and smoke-test
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3003/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          npm run smoke
          kill $SERVER_PID

      - name: Upload browser failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
