<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Variant C — restructure. The overview IS "start a run"; history/stats become secondary.
     The start control reuses the record screen's press-and-hold footprint language and sits
     in the lower half where the thumb naturally rests. */
  .header { text-align: center; margin-top: 4px; }

  .modes { display: flex; background: var(--surface-muted); border-radius: 999px; padding: 4px; margin-top: 4px; }
  .mode { flex: 1; text-align: center; padding: 10px 0; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
  .mode.active { background: var(--primary); color: var(--on-primary); }

  .statusline { display: flex; justify-content: center; gap: 18px; margin-top: 14px; }
  .statusline span { display: flex; align-items: center; gap: 5px; font-size: 14px; }
  .statusline .gps { color: var(--primary); }
  .statusline .gps svg { stroke: var(--primary); }
  .statusline .priv { color: var(--text-muted); }
  .statusline .priv svg { stroke: var(--text-muted); }
  .statusline svg { width: 15px; height: 15px; }

  .holdwrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .hold {
    width: 224px; height: 224px; border-radius: 999px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 3px solid var(--primary);
    background: radial-gradient(circle at 50% 58%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 68%);
  }
  .hold .ring { position: absolute; inset: -12px; border-radius: 999px; border: 2px dashed color-mix(in srgb, var(--primary) 45%, transparent); }
  .hold svg { width: 56px; height: 56px; stroke: var(--primary); }
  .hold .t { font-size: 21px; font-weight: 600; color: var(--text-strong); margin-top: 6px; }
  .hold .s { font-size: 14px; color: var(--text-muted); }

  .statsrow { display: flex; align-items: center; }
  .statsrow .metric .value { font-size: 16px; }
  .weeklink { display: flex; align-items: center; justify-content: space-between; }
  .weeklink .lhs { display: flex; align-items: center; gap: 10px; }
  .weeklink .lhs svg { width: 18px; height: 18px; stroke: var(--accent); }
  .weeklink .go { display: flex; align-items: center; gap: 4px; color: var(--primary); font-size: 14px; font-weight: 600; }
  .weeklink .go svg { width: 15px; height: 15px; stroke: var(--primary); }

  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="scroll" style="gap:10px">
    <div class="brandbar">
      <img class="logo-light" src="../../../../../public/brand/zidrun-logo.svg" alt="">
      <img class="logo-dark" src="../../../../../public/brand/zidrun-logo-dark.svg" alt="">
      <img class="logo-race" src="../../../../../public/brand/zidrun-logo-race.svg" alt="">
      <div class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16v-3"/><path d="M12 16V8"/><path d="M17 16v-5"/></svg></div>
    </div>

    <div class="header">
      <div class="headline-md">Ready when you are</div>
    </div>

    <div class="modes">
      <div class="mode active">Free run</div>
      <div class="mode">Guided</div>
      <div class="mode">Planned</div>
    </div>

    <div class="statusline">
      <span class="gps"><svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>GPS ready</span>
      <span class="priv"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Private</span>
    </div>

    <div class="holdwrap">
      <div class="hold">
        <div class="ring"></div>
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>
        <div class="t">Hold to begin</div>
        <div class="s">Free run · GPS</div>
      </div>
    </div>

    <!-- Momentum compressed into one strip -->
    <div class="card statsrow">
      <div class="metric"><div class="label">This week</div><div class="value">9.2 km · 1 run</div></div>
      <div class="metric-div"></div>
      <div class="metric"><div class="label">Streak</div><div class="value">7 weeks</div></div>
      <div class="metric-div"></div>
      <div class="metric"><div class="label">Best pace</div><div class="value">4:58/km</div></div>
    </div>

    <div class="card weeklink" style="margin-bottom:88px">
      <div class="lhs">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 19a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><path d="M15 5a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></svg>
        <div>
          <div class="title-sm" style="color:var(--text-strong)">Monday plan session</div>
          <div class="body-sm muted num">9.20 km · 6:11/km · yesterday</div>
        </div>
      </div>
      <div class="go">History
        <svg class="ic" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M16 2v4"/><path d="M21 11.75V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7.25"/><path d="m22 22-1.875-1.875"/><path d="M3 10h18"/><path d="M8 2v4"/><circle cx="18" cy="18" r="3"/></svg></div><div class="lbl">Races</div></div>
    <div class="tab active"><div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg></div><div class="lbl">Runs</div></div>
    <div class="tab"><div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg></div><div class="lbl">Coach</div></div>
    <div class="tab"><div class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 0 10 0a5 5 0 1 0-10 0"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></div><div class="lbl">Account</div></div>
  </div>
</div>
</body>
</html>
